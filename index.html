.xp .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:6px}

.big{width:100%;min-height:56px;border:0;border-radius:16px;background:var(--brand);color:#fff;font-weight:800;font-size:18px;margin-top:22px;box-shadow:0 6px 0 #2f23b8}

.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:24px;box-shadow:0 14px 40px -18px #4b3df566;min-height:clamp(360px,54vh,480px);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y}
.card::before{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:var(--c);opacity:.18}

.src{font-size:13px;color:var(--mut);font-weight:600;white-space:nowrap}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 22px 22px;position:relative}

.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}

nav div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%;max-width:540px}
nav button{min-height:54px;border:0;border-radius:14px;background:none;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut)}

.ref{margin:10px 0 0;font-size:13px;color:var(--mut);font-weight:600}
.src{color:#2f8a3a!important}
.rep{border:0;background:none;color:var(--mut);text-decoration:underline;font-size:13px;min-height:36px;padding:0 6px}

  transform:rotate(calc(360deg/var(--n)*var(--i))) translateY(calc(-1*min(44vh,44vw) - 40px)) rotate(calc(-360deg/var(--n)*var(--i)));animation:pop .5s cubic-bezier(.2,1.4,.4,1) both,flo 4s ease-in-out infinite alternate;animation-delay:calc(var(--i)*90ms),calc(var(--i)*90ms + .5s)}

comida:{n:"Comida",c:"#ff8a5c",f:[

argentina:{n:"Argentina",c:"#8fd3ff",f:[

};
const COLS=["#7cc4ff","#7be08f","#ffb347","#c9a7ff","#ff6b9a","#5fd4d0","#ff8a5c","#9fb4ff","#ffd166","#b5e48c"];
const col=n=>{const p=Object.values(T).find(o=>o.n===n);if(p)return p.c;let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))>>>0;return COLS[h%COLS.length]};
const TITLES=["Curioso","Aprendiz","Explorador","Investigador","Sabelotodo","Erudito","Mente Pelaez"];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]);
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const day=o=>{const d=new Date(Date.now()-(o||0)*864e5);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)};
const ld=(k,d)=>{try{const v=localStorage.getItem("pmx-"+k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem("pmx-"+k,JSON.stringify(v))}catch(e){}};

const sb=window.supabase&&!SUPABASE_URL.includes("TU-PROYECTO.")?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false}}):null;
const S={xp:ld("xp",0),streak:ld("streak",{d:"",n:0}),favs:ld("favs",[]),seen:ld("seen",[]),liked:ld("liked",[]),reported:ld("reported",[]),cnt:ld("cnt",0),qok:ld("qok",0)};
const save=()=>{for(const k in S)sv(k,S[k])};
let todayList=[],older=null,queue=[],quizPool=[],cur=null,view="feed",since=0,mode="today",batchDate="";

/* ---------- XP, racha, progreso del día ---------- */
function hud(){}
function gain(n){}
function tickStreak(){}

/* ---------- datos ---------- */
const mapRow=r=>({key:"id:"+r.id,id:r.id,t:r.tema_nombre,d:r.dato,p:r.porque||"",f:r.fuente||"",
  q:r.pregunta&&Array.isArray(r.opciones)&&Number.isInteger(r.correcta)?{q:r.pregunta,o:r.opciones.map(String),a:r.correcta}:null});
const libList=()=>Object.values(T).flatMap(o=>o.f.map(d=>({key:"lib:"+d.slice(0,60),t:o.n,d,p:"",f:"",q:null})));
async function loadToday(){
  if(sb){try{
    const {data:last,error:e1}=await sb.from("datos").select("publicado").order("publicado",{ascending:false}).limit(1);
    if(e1)throw e1;
    if(last&&last.length){batchDate=last[0].publicado;
      const {data,error}=await sb.from("datos").select("id,tema_nombre,dato,porque,fuente,pregunta,opciones,correcta").eq("publicado",batchDate).order("id").limit(500);
      if(error)throw error;todayList=(data||[]).map(mapRow);return}
  }catch(e){}}
  todayList=libList();batchDate="";
}
async function loadOlder(){
  if(older)return older;older=[];
  if(sb&&batchDate){try{
    const {data}=await sb.from("datos").select("id,tema_nombre,dato,porque,fuente,pregunta,opciones,correcta").lt("publicado",batchDate).order("publicado",{ascending:false}).order("id").limit(1000);
    older=(data||[]).map(mapRow);
  }catch(e){}}
  const seen=new Set(S.seen);older=older.filter(x=>!seen.has(x.key));return older;
}
function buildQueue(list){const seen=new Set(S.seen);queue=list.filter(x=>!seen.has(x.key))}
function markRead(it){ // se cuenta como leído al tocar "Siguiente"
  if(!it||!it.key||S.seen.includes(it.key))return;
  S.seen.push(it.key);if(S.seen.length>20000)S.seen=S.seen.slice(-20000);
  S.cnt++;gain(5);
  if(it.id&&sb)sb.rpc("sumar_vista",{p_id:it.id}).then(()=>{},()=>{});
  if(it.q){quizPool.push({...it.q,t:it.t});if(quizPool.length>8)quizPool.shift()}
  since++;save();hud();
}

/* ---------- tarjetas ---------- */
function setCard(html,c){const k=$("card");k.style.setProperty("--c",c);k.innerHTML=html;k.classList.remove("anim");void k.offsetWidth;k.classList.add("anim")}
function next(){
  if(cur&&cur.d)markRead(cur);
  if(false){since=0;showQuiz(quizPool.splice(Math.floor(Math.random()*quizPool.length),1)[0]);return}
  const it=queue.shift();
  if(!it){drawDone();return}
  cur=it;tickStreak();drawFact(it);
}
function drawFact(it){
  setCard(`<div class="head"><span class="tag"></span><span class="src">${mode==="today"?"Dato del día":"Dato anterior"}</span></div><div class="body"><p class="lead">¿Sabías que…?</p><p class="fact"></p><p class="ref"></p>${it.p?'<div class="why"><button id="whyb" aria-expanded="false">💡 ¿Por qué?</button><p hidden id="whyp"></p></div>':''}</div>`,col(it.t));
  const k=$("card");k.querySelector(".tag").textContent=it.t;k.querySelector(".fact").textContent=it.d;
  k.querySelector(".ref").textContent=it.f?"Fuente: "+it.f:"Biblioteca Pelaez Mind";
  if(it.p){k.querySelector("#whyp").textContent=it.p;k.querySelector("#whyb").onclick=e=>{const p=$("whyp"),o=p.hidden;p.hidden=!o;e.currentTarget.setAttribute("aria-expanded",o);if(o&&!it.wx){it.wx=1;gain(2)}}}
  $("like").disabled=$("copy").disabled=false;$("report").hidden=false;
  $("like").setAttribute("aria-pressed",S.liked.includes(it.key));$("next").textContent="Siguiente dato →";
  $("mode").textContent=mode==="today"?"Todos leen los mismos datos hoy. Cada dato lo ves una sola vez.":"Estás leyendo datos de días anteriores que te perdiste.";
}
function showQuiz(q){
  cur={quiz:true};
  setCard(`<div class="head"><span class="tag">Quiz rápido · ${esc(q.t)}</span><span class="src">+20 XP</span></div><div class="body"><p class="lead">A ver si te acordás…</p><p class="fact" style="font-size:clamp(19px,5vw,23px)"></p><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><p class="res" id="res" aria-live="polite"></p></div>`,col(q.t));
  $("card").querySelector(".fact").textContent=q.q;
  $("like").disabled=$("copy").disabled=true;$("report").hidden=true;$("next").textContent="Saltar →";
  $("card").querySelector(".opts").onclick=e=>{const b=e.target.closest(".opt");if(!b||cur.done)return;cur.done=1;
    const i=+b.dataset.i,bs=[...$("card").querySelectorAll(".opt")];if(bs[q.a])bs[q.a].classList.add("ok");
    if(i===q.a){S.qok++;$("res").textContent="¡Bien ahí! +20 XP";gain(20)}else{b.classList.add("bad");$("res").textContent="Casi. La correcta está en verde."}
    $("next").textContent="Seguir →"};
}
async function drawDone(){
  cur={done:true};$("like").disabled=$("copy").disabled=true;$("report").hidden=true;
  const prev=mode==="today"?(await loadOlder()).length:0;
  const tot=todayList.length;
  setCard(`<div class="body load done"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="#c8f542"/><path d="M20 33l8 8 16-18" fill="none" stroke="#14122b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><p class="fact">${mode==="today"?"¡Leíste los "+tot+" datos de hoy!":"¡Te pusiste al día!"}</p><p>Mañana hay datos nuevos. ¡Te esperamos!</p></div>`,"#c8f542");
  if(prev){$("next").textContent="Leer "+prev+" datos que te perdiste →";$("next").onclick=()=>{mode="older";queue=older.slice();older=[];$("next").onclick=null;cur=null;next()}}
  else{$("next").textContent="Volvé mañana 👋";$("next").onclick=()=>toast("Mañana hay datos nuevos")}
  $("mode").textContent="No repetimos datos: cada uno lo ves una sola vez.";
}

/* ---------- intro diaria ---------- */
function intro(n){
  if(ld("intro","")===day()){return Promise.resolve()}
  return new Promise(res=>{
    const el=$("intro");el.hidden=false;
    const d=new Date();const ds=d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});$("i-date").textContent=ds.charAt(0).toUpperCase()+ds.slice(1);
    const names=Object.values(T).map(o=>o.n);
    $("orbit").innerHTML=names.map((t,i)=>`<span style="--i:${i};--n:${names.length};--c:${col(t)}">${esc(t)}</span>`).join("");
    const num=$("i-num"),dur=matchMedia("(prefers-reduced-motion: reduce)").matches?0:1600,t0=performance.now();
    const tick=now=>{const p=dur?Math.min(1,(now-t0)/dur):1;num.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick);else el.classList.add("ready")};
    requestAnimationFrame(tick);
    $("i-go").onclick=()=>{sv("intro",day());el.classList.add("out");setTimeout(()=>{el.hidden=true;res()},dur?450:0)};
  });
}

/* ---------- vistas ---------- */
function drawFavs(){const L=$("favlist");
  if(!S.favs.length){L.innerHTML=`<div class="empty"><b>Todavía no guardaste ningún dato.</b><br>Tocá el corazón en los que te gusten y te quedan acá para repasar.</div>`;return}
  L.innerHTML=S.favs.map((f,i)=>`<div class="fav"><span class="tag" style="background:${col(f.t)}">${esc(f.t)}</span><p>${esc(f.d)}</p><button data-i="${i}">Quitar</button></div>`).join("")}
function drawMe(){const lv=Math.floor(S.xp/100),seen=new Set(S.seen),read=todayList.filter(x=>seen.has(x.key)).length;
  const s=[["Nivel "+(lv+1),TITLES[Math.min(lv,TITLES.length-1)],1],[S.streak.n+(S.streak.n===1?" día":" días"),"Racha actual"],[read+" / "+todayList.length,"Datos de hoy"],[S.cnt,"Datos aprendidos"],[S.qok,"Quizzes acertados"],[S.favs.length,"Favoritos"]];
  $("stats").innerHTML=s.map(x=>`<div class="stat${x[2]?' hl':''}"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join("")}
function show(v){view=v;["feed","favs"].forEach(x=>$("v-"+x).hidden=x!==v);
  document.querySelectorAll("nav button").forEach(b=>{if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(v==="favs")drawFavs();hud();window.scrollTo(0,0)}

/* ---------- eventos ---------- */
$("next").addEventListener("click",()=>{if(!$("next").onclick)next()});
$("like").addEventListener("click",()=>{if(!cur||!cur.d)return;const k=cur.key;
  if(S.liked.includes(k)){S.liked=S.liked.filter(x=>x!==k);S.favs=S.favs.filter(f=>f.d!==cur.d);$("like").setAttribute("aria-pressed",false);toast("Quitado de favoritos")}
  else{S.liked.push(k);S.favs.unshift({t:cur.t,d:cur.d});$("like").setAttribute("aria-pressed",true);toast("¡Te gustó! Guardado en favoritos");
    if(cur.id&&sb)sb.rpc("sumar_like",{p_id:cur.id}).then(()=>{},()=>{})}
  save()});
$("copy").addEventListener("click",async()=>{if(!cur||!cur.d)return;
  const txt="🧠 ¿Sabías que "+cur.d.charAt(0).toLowerCase()+cur.d.slice(1)+"\n\nMás datos curiosos todos los días en "+SITE;
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(txt);toast("Dato copiado: pegalo donde quieras")}catch(e){toast("No se pudo copiar")}});
$("report").addEventListener("click",()=>{if(!cur||!cur.d)return;const it=cur;
  if(!S.reported.includes(it.key)){S.reported.push(it.key);if(it.id&&sb)sb.rpc("reportar_dato",{p_id:it.id}).then(()=>{},()=>{})}
  S.favs=S.favs.filter(f=>f.d!==it.d);save();toast("Gracias por avisar. Lo vamos a revisar");next()});
$("favlist").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;S.favs.splice(+b.dataset.i,1);save();drawFavs()});
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.v)));
let x0=null;const card=$("card");
card.addEventListener("pointerdown",e=>{x0=e.clientX});
card.addEventListener("pointerup",e=>{if(x0!==null&&e.clientX-x0<-60&&cur&&cur.d)next();x0=null});
document.addEventListener("keydown",e=>{if(view==="feed"&&e.key==="ArrowRight"&&e.target===document.body&&!$("next").onclick){e.preventDefault();next()}});

/* ---------- arranque ---------- */
setCard(`<div class="body load"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--soft)" stroke-width="7"/><path class="spin" d="M32 6a26 26 0 0 1 26 26" fill="none" stroke="#4b3df5" stroke-width="7" stroke-linecap="round"/></svg>Cargando los datos de hoy…</div>`,"#4b3df5");
show("feed");
loadToday().then(async()=>{
  buildQueue(todayList);hud();
  await intro(todayList.length);
  next();
});
}
</script>
</body>
</html>
